name: Build Sportsbox APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sports-boxbox (1).zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36-ext1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract project
        run: |
          mkdir project
          unzip -q "sports-boxbox (1).zip" -d project

      - name: Create debug key
        run: |
          keytool -genkeypair -v \
            -keystore project/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK
        run: gradle -p project :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Sportsbox-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
