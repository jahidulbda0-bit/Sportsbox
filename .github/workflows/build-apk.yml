name: Build Sportsbox APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sports-BoX-Adsterra.zip'
      - 'sports-boxbox (1).zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          mkdir -p project

          if [ -f "Sports-BoX-Adsterra.zip" ]; then
            ZIP_FILE="Sports-BoX-Adsterra.zip"
          elif [ -f "sports-boxbox (1).zip" ]; then
            ZIP_FILE="sports-boxbox (1).zip"
          else
            echo "Android project ZIP not found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          SETTINGS=$(find project -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -name settings.gradle -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found!"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "App Gradle file not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Create debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sportsbox-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
