name: Build Sports BoX APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Android ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP not found!"
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"
          mkdir -p app-source
          unzip -q "$ZIP_FILE" -d app-source

      - name: Find Android Project
        shell: bash
        run: |
          WRAPPER=$(find app-source -type f -name gradlew | head -n 1)

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR=$(dirname "$WRAPPER")
          else
            SETTINGS=$(find app-source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle not found!"
              find app-source -maxdepth 4 -type f | head -100
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle Wrapper if Missing
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "Gradle wrapper missing. Generating..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi

          if [ ! -f gradlew ]; then
            echo "ERROR: Could not generate Gradle wrapper!"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          find "$PROJECT_DIR" -type f -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if [ -z "$(ls -A "$GITHUB_WORKSPACE/apk-output")" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sports-BoX-APK
          path: apk-output/*.apk
          if-no-files-found: error
