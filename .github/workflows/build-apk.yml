name: Build Sports BoX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Smart Link Source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*SmartLink*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p app-source
            unzip -q "$ZIP_FILE" -d app-source
            echo "SOURCE_DIR=$GITHUB_WORKSPACE/app-source" >> $GITHUB_ENV
          else
            echo "No SmartLink ZIP found. Using repository files."
            echo "SOURCE_DIR=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          fi

      - name: Locate Gradle Project
        run: |
          GRADLE_FILE=$(find "$SOURCE_DIR" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: gradlew not found in source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sports-BoX-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
